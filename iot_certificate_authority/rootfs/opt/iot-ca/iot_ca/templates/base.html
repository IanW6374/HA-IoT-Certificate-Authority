<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}IoT Certificate Authority{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">CA</span><span>IoT Certificate Authority</span></a>
    {% if initialized %}
    <nav aria-label="Primary">
      <a href="{{ url_for('dashboard') }}"{{ ' class="active" aria-current="page"'|safe if request.endpoint == 'dashboard' else '' }}>Overview</a>
      <a href="{{ url_for('certificates') }}"{{ ' class="active" aria-current="page"'|safe if request.endpoint in ('certificates', 'certificate_detail', 'new_certificate', 'new_public_certificate', 'new_device_enrollment') else '' }}>Certificates</a>
      <a href="{{ url_for('audit') }}"{{ ' class="active" aria-current="page"'|safe if request.endpoint == 'audit' else '' }}>Audit</a>
      <a href="{{ url_for('settings') }}"{{ ' class="active" aria-current="page"'|safe if request.endpoint == 'settings' else '' }}>Settings</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}" role="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
