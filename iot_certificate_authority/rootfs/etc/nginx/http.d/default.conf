server {
    listen 8099;
    listen [::]:8099;

    allow 172.30.32.2;
    deny all;

    client_max_body_size 1m;
    server_tokens off;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        # External ACME DNS-01 may wait for authoritative DNS propagation.
        # Keep this above the ACME subprocess ceiling so the UI receives the
        # real success or error response instead of an nginx 504 page.
        proxy_connect_timeout 15s;
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;
        send_timeout 420s;
    }
}
