name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Unit tests
        env:
          PYTHONPATH: iot_certificate_authority/rootfs/opt/iot-ca
        run: python -m unittest discover -v
      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (
              Path("repository.yaml"),
              Path("iot_certificate_authority/config.yaml"),
              Path("iot_certificate_authority/translations/en.yaml"),
          ):
              yaml.safe_load(path.read_text())
              print("valid YAML:", path)
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: iot_certificate_authority
          push: false
          platforms: linux/amd64
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=0.1.1
