name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Unit tests
        env:
          PYTHONPATH: iot_certificate_authority/rootfs/opt/iot-ca
        run: python -m unittest discover -v
      - name: Compile target-native read-only host clock query
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 iot_certificate_authority/rootfs/opt/iot-ca/clock_status.c -o /tmp/iot-ca-clock-status
          /tmp/iot-ca-clock-status | python -c 'import json,sys; x=json.load(sys.stdin); assert all(type(x[k]) is int for k in ("result", "status", "maxerror"))'
      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (
              Path("repository.yaml"),
              Path("iot_certificate_authority/config.yaml"),
              Path("iot_certificate_authority/build.yaml"),
              Path("iot_certificate_authority/translations/en.yaml"),
          ):
              yaml.safe_load(path.read_text())
              print("valid YAML:", path)
          PY

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/base:3.22
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/base:3.22
          - arch: armv7
            platform: linux/arm/v7
            base: ghcr.io/home-assistant/armv7-base:3.22
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Read add-on version
        id: version
        run: |
          echo "value=$(sed -n 's/^version: "\([^"]*\)"/\1/p' iot_certificate_authority/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: iot_certificate_authority
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_FROM=${{ matrix.base }}
            BUILD_VERSION=${{ steps.version.outputs.value }}
